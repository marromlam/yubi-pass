<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            width: 340px;
            background: #f8f9fa;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 10px;
            border-bottom: 1px solid #e5e5e5;
            background: #fff;
        }
        header h2 { font-size: 15px; color: #1c1c1e; }

        /* Gear / Back buttons */
        .icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .icon-btn:hover { background: #f0f0f0; }

        /* Main view — account list */
        #accountList {
            padding: 10px 16px 14px;
            min-height: 80px;
        }
        .account-item {
            font-size: 13px;
            color: #1c1c1e;
            padding: 6px 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .account-item:last-child { border-bottom: none; }
        .empty { font-size: 12px; color: #aaa; text-align: center; padding: 16px 0; }
        .error-msg { font-size: 12px; color: #ff3b30; text-align: center; padding: 16px 8px; }

        /* Spinner */
        .spinner-wrap { display: flex; justify-content: center; padding: 20px 0; }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid #ddd;
            border-top-color: #007aff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Settings view */
        #settingsView { display: none; }
        .settings-body { padding: 12px 16px 14px; }

        .form-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        input[type="text"] {
            flex: 1;
            min-width: 80px;
            padding: 7px 9px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        button.add-btn {
            padding: 7px 12px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        button.add-btn:hover { background: #0056cc; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #555; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid #ddd; }
        td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; color: #1c1c1e; word-break: break-all; }
        button.del-btn {
            padding: 2px 8px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main view -->
    <div id="mainView">
        <header>
            <h2>🔐 YubiPass</h2>
            <button class="icon-btn" id="gearBtn" title="Settings">⚙️</button>
        </header>
        <div id="accountList">
            <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- Settings view -->
    <div id="settingsView">
        <header>
            <button class="icon-btn" id="backBtn" title="Back">←</button>
            <h2>Mappings</h2>
            <span style="width:28px"></span>
        </header>
        <div class="settings-body">
            <form id="addMappingForm">
                <div class="form-row">
                    <input type="text" id="urlInput" placeholder="domain.com" required>
                    <input type="text" id="aliasInput" placeholder="YubiKey account name" required>
                    <button class="add-btn" type="submit">Add</button>
                </div>
            </form>
            <div id="mappingList"></div>
        </div>
    </div>

    <script src="popup.js" defer></script>
</body>
</html>
